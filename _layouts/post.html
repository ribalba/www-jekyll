---
layout: default
---
<article class="page post">
  <header class="page-head">
    <p class="eyebrow"><a href="{{ '/news/' | relative_url }}">News</a> &middot; <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
    <h1>{{ page.title }}</h1>
  </header>
  {{ content }}
</article>
