<!doctype html>
<html lang="en">
<head>
{% include head.html %}
</head>
<body class="layout-{{ page.layout }}">
<a class="skip" href="#content">Skip to content</a>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">
      {% include logo.svg %}
      <span class="brand-text"><span class="brand-name">HotCarbon</span><span class="brand-sub">{{ site.subtitle }}</span></span>
    </a>
    <nav class="site-nav" aria-label="Main">
      {% include nav.html %}
    </nav>
  </div>
</header>
<main id="content" class="wrap">
{{ content }}
</main>
<footer class="site-footer">
  <div class="wrap">
    {% include footer.html %}
  </div>
</footer>
</body>
</html>
