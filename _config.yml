# HotCarbon website
#
# This file is *NOT* reloaded automatically when you use `jekyll serve`.
# Restart the server after changing it.

title       : "HotCarbon"
subtitle    : "Workshop on Sustainable Computer Systems"
description : "HotCarbon brings together researchers and practitioners in computer and networked systems to discuss sustainability throughout the entire computing lifecycle."
url         : "https://hotcarbon.org"
baseurl     : ""
repository  : "https://github.com/hotcarbon/www-jekyll"
locale      : "en-US"

# The edition shown on the home page and in the main navigation.
# All per-year facts (dates, deadlines, chairs, links) live in _data/editions.yml.
current_edition: 2027

permalink: pretty

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

plugins:
  - jekyll-sitemap

# Talk transcripts, one file per video in _transcripts/YYYY/.
# They are generated with the scripts in _tools/transcripts/.
collections:
  transcripts:
    output: true

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: transcripts
    values:
      layout: transcript
      render_with_liquid: false

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - publish.sh
  - vendor
  - _code-snippets.md
  - _docs
  - _bibliography
  # Leftovers from the Minimal Mistakes theme, no longer used
  - assets/css/main.scss
  - pages/pastEditions/2022.md
  - pages/pastEditions/2023.md
  - pages/pastEditions/2024.md
  - pages/pastEditions/2025.md
  - pages/pastEditions/2026.md
  - pages/program_onepage.md
  - pages/00-todos.md
